<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A 2048 port in vanilla JavaScript with a few extra features: d-pad buttons optimized for (my) thumbs on small touchscreens, time travel replay, and stats." />
  <title>2048 in vanilla JavaScript</title>
  <style>
    /* The face Dear ImGui renders the other demo's window with, down to the tile
       numbers: HelloImGui ships DroidSans.ttf as its default UI font. No desktop or
       phone has it installed, so leaving it to a font stack meant every visitor saw
       the local UI face instead. 15 KB subset; see the .LICENSE.txt beside it. */
    @font-face {
      font-family: "Droid Sans";
      src: url("./droid-sans-latin.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: dark;

      /* Two faces, split the way the other demo splits: the page around the game is
         DOM in both, and is styled here exactly as it is over there, while the panel
         stands in for the canvas and takes imgui's font. */
      --page-font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      --panel-font: "Droid Sans", var(--page-font);
      --ui-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      font-family: var(--page-font);
      background: #0f1117;
      color: #e6edf3;

      /* Painted by the script on every resize; every board dimension derives from them. */
      --cell: 92px;
      --gap: 8px;

      /* The graph's two series, and nothing else in the page is coloured with them: its
         axes and labels are the panel's own greys, so the only thing colour means there
         is which series a mark belongs to. Stepped for the popup's ground rather than
         picked by eye -- both clear 3:1 against it, and they stay a distinguishable pair
         under every kind of colour blindness. Here rather than on the popup because the
         script reads them back off an off-screen swatch, which is not inside it. */
      --series-points: #3987e5;
      --series-undos: #d95926;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    /* Ground, ink and face are all set here rather than left to inherit from :root.
       This page is also published as an Artifact, which wraps it in a host document
       whose reset styles `body` -- `color:#141413` for a light viewer -- and a rule on
       body beats anything inherited from html. Inheriting cost every label in the page
       its colour and left near-black text on a near-black panel. */
    body {
      display: grid;
      background: #0f1117;
      color: #e6edf3;
      font-family: var(--page-font);
      grid-template-rows: auto 1fr;
      /* Not `auto`: an auto column is sized by the panel, which would let a board that
         does not fit push the play area wider than the viewport it is measured against. */
      grid-template-columns: minmax(0, 1fr);
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    }

    h1 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 650;
    }

    #status {
      font-family: var(--ui-mono);
      font-size: 12px;
      color: #9fb3c8;
      white-space: pre-wrap;
    }

    #status:empty { display: none; }

    main {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 14px;
      overflow: hidden;
      background: #12151f;
      /* `manipulation` rather than `none`: it still drops the double-tap zoom that a
         hammered board would otherwise trigger, and swipes are read from touchstart
         and touchend coordinates, so nothing here needs the browser to hand over the
         gesture wholesale. What `none` also took was the pinch -- leaving a player who
         had zoomed in with no way to zoom back out over the part of the screen the
         board covers, and no way to pan around what they were stuck at either. */
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* The panel stands in for the imgui window: its font, its neutral grey against the
       page's near-black, fixed padding, 4px item spacing, and a board that takes
       whatever vertical room the rest of the stack leaves over. No drop shadow --
       imgui's window does not cast one. */
    #panel {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 100%;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      background: #262626;
      color: #fff;
      font-family: var(--panel-font);
      font-size: 14px;
    }

    #panel p {
      margin: 0;
      min-height: 1.35em;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    /* Both halves of the header. Fixed-width digits so neither line twitches as its
       numbers roll over -- the clock ticks four times a second, so it would twitch the
       most -- and the two fields of the second line unbreakable, so if it ever has to
       wrap it wraps between them rather than inside "Move 128/512". */
    #score-line,
    #progress-line {
      font-variant-numeric: tabular-nums;
    }

    #timeline-label,
    #play-time {
      white-space: nowrap;
    }

    /* The readings line. Fixed-width digits for the same reason the score line has them,
       and more need of it: the frame rate leads the line and is repainted four times a
       second, so every field to its right moves with it -- and on a variable-refresh
       display it wobbles a couple of Hz on its own, with nothing happening at all. */
    #stats {
      font-variant-numeric: tabular-nums;
    }

    /* No secondary text scale or colour inside the panel: imgui draws every line of
       that window in one size and one colour, help and stats included. Only the page
       header, which the other demo styles with this same stylesheet, is set apart. */

    hr {
      width: 100%;
      height: 1px;
      margin: 4px 0;
      border: 0;
      background: rgba(255, 255, 255, 0.14);
    }

    /* Sized like an imgui frame -- its 4x3 frame padding, minus the border -- rather
       than like a web button, so New Game and Share sit as tight to their labels as
       they do in the other demo. */
    button {
      padding: 3px 6px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      background: #343434;
      color: inherit;
      font: inherit;
      line-height: 1.2;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { background: #3f3f3f; }
    /* imgui fills a held button with the theme's accent rather than a lighter grey. */
    button:active { background: #4b6eaf; }
    button:focus-visible { outline: 2px solid #6f8fd0; outline-offset: 2px; }

    /* Also the anchor the move-history popup positions itself against. It wraps rather
       than overflows, since the move counter grows with the game. */
    #actions {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    /* Board ---------------------------------------------------------------- */

    #board-wrap {
      display: grid;
      place-items: center;
      flex: 1;
      min-height: 0;
      margin: 6px 0;
      overflow: hidden;
    }

    #board {
      position: relative;
      width: calc(var(--cell) * 4 + var(--gap) * 3);
      height: calc(var(--cell) * 4 + var(--gap) * 3);
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, var(--cell));
      gap: var(--gap);
    }

    .cell, .tile-face {
      width: var(--cell);
      height: var(--cell);
      border-radius: 6px;
      background: #333845;
    }

    #tiles {
      position: absolute;
      inset: 0;
    }

    /* Tiles are painted rather than laid out: they overlap, move between cells, and
       scale independently of the grid. The outer element carries the slide the script
       animates, the face carries the pop, so the two never fight over one transform. */
    .tile {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Regular weight, like the numbers imgui scales up out of its own font atlas. */
    .tile-face {
      display: grid;
      place-items: center;
      color: #fff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* The spawn and merge bursts are scaled by the frame loop, next to the slide, for
       the same reason the slide is: an embedder that overrides CSS animation, or a
       browser that decides not to run one, took the whole effect with it. All three
       are transforms on a tile that is already in place -- nothing flashes, nothing
       moves at the page level -- so they run for everyone, as they do in the canvas
       demo this mirrors. */

    .v2 { background: #667a99; }
    .v4 { background: #5287b3; }
    .v8 { background: #3d9eb8; }
    .v16 { background: #33ad94; }
    .v32 { background: #70b357; }
    .v64 { background: #b3a840; }
    .v128 { background: #c7873d; }
    .v256 { background: #c76147; }
    .v512 { background: #b8476b; }
    .v1024 { background: #994d9e; }
    .v2048 { background: #7359d9; }
    .beyond { background: #4d3d8c; }

    button:disabled {
      background: #2b2b2b;
      color: #808080;
      cursor: default;
    }

    button:disabled:hover { background: #2b2b2b; }

    /* Timeline -------------------------------------------------------------- */

    /* The clock and the graph ride in the New Game line, under the move the board is on:
       what is always up is where the game has got to, not how to walk back through it or
       how it got there. Both are icons in a row of words, so both are centred in a frame
       sized like the buttons beside them. */
    #time-travel,
    #graph {
      display: grid;
      place-items: center;
    }

    /* Drawn rather than set: the panel's font is a Latin subset with no clock in it,
       and an emoji would arrive in the system's own colours, which this panel has
       none of. */
    #time-travel svg,
    #graph svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Both popups open downward from the button that owns them, over the help line --
       which puts them just clear of the board, the one thing scrubbing is for looking at.
       They share an anchor and are never open together, so they share their chrome. */
    #timeline,
    #stats-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      left: 0;
      z-index: 1;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      /* Opaque, and the play area's own ground rather than the panel's: the stats line
         underneath showed through even a 6% window, and this popup casts a shadow
         instead of blurring what is behind it, as the panel casts none either. */
      background: #12151f;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.32);
    }

    /* One row inside, wrapping only where a phone cannot fit it: the slider keeps the
       space the buttons leave, down to a width where dragging still works. */
    #timeline {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    #timeline[hidden],
    #stats-panel[hidden] { display: none; }

    /* Built out of its parts rather than themed with `accent-color`: the marker is a
       playhead, not a bubble, and a browser's own thumb cannot be made into one. */
    #scrubber {
      flex: 1 1 120px;
      min-width: 0;
      height: 20px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      /* The board reads swipes off touchstart and touchend anywhere in `main`, so a
         drag along the slider would otherwise be delivered as a move as well. Taking
         the touch outright leaves the drag to the control that the gesture is aimed at;
         the swipe handler skips this row for the same reason. */
      touch-action: none;
    }

    #scrubber:focus-visible { outline: 2px solid #6f8fd0; outline-offset: 2px; }

    /* How much of the game is behind the marker. Chrome has no pseudo-element for the
       filled part of a track, so it is a gradient stop, and game.js paints --scrub with
       the position rather than leaving the two to disagree. Firefox has one, and takes
       the flat track underneath. */
    #scrubber::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #4b6eaf var(--scrub, 100%), #3a3f4b var(--scrub, 100%));
    }

    #scrubber::-moz-range-track {
      height: 6px;
      border-radius: 3px;
      background: #3a3f4b;
    }

    #scrubber::-moz-range-progress { height: 6px; border-radius: 3px; background: #4b6eaf; }

    /* The marker itself: a slim bar standing across the track. The negative margin is
       what centres it on a 6px track WebKit would otherwise hang it below. */
    #scrubber::-webkit-slider-thumb {
      width: 4px;
      height: 18px;
      margin-top: -6px;
      border-radius: 2px;
      background: #e6edf3;
      appearance: none;
      -webkit-appearance: none;
    }

    #scrubber::-moz-range-thumb {
      width: 4px;
      height: 18px;
      border: 0;
      border-radius: 2px;
      background: #e6edf3;
    }

    /* Nothing to scrub yet: the track reads as empty rather than as a game already run
       end to end, and the marker sits quietly where the newest state always is. */
    #scrubber:disabled::-webkit-slider-runnable-track { background: #33363f; }
    #scrubber:disabled::-moz-range-progress { background: #33363f; }
    #scrubber:disabled::-webkit-slider-thumb { background: #6f757f; }
    #scrubber:disabled::-moz-range-thumb { background: #6f757f; }

    /* The two steps are one control and sit as one: closer to each other than to the
       track they walk along, the way the d-pad pairs its own arrows. */
    .step-pair {
      display: flex;
      gap: 4px;
    }

    /* Tapped twice in a row as ordinary use -- stepping back and back, opening the
       popup and closing it -- exactly like a d-pad arrow, so they need the same
       defence against a phone reading two taps as a zoom. */
    #step-back, #step-forward, #time-travel, #graph, #undo { touch-action: none; }

    /* Not in play: the board is drawn back from a live one, so a board that will not
       move never has to be told apart by trying it. Two ways to get here and one look
       for both -- an earlier state is on screen, or a popup is up and has stopped play --
       because what they have in common is the whole of what this says. */
    #board.past #tiles,
    #board.paused #tiles { opacity: 0.75; }

    #board.past .cell,
    #board.paused .cell { background: #2c303a; }

    /* The move played next, over the board it was played from. It sits outside #tiles
       so it stays crisp against the board those rules dim, and takes no pointer events
       so a swipe across the middle of the board is still a swipe. */
    #next-move {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    #next-move[hidden] { display: none; }

    /* Well under a tile's width: the point of scrubbing back is to read the board, and
       a badge any bigger sits on top of the very tiles being read. */
    #next-move svg {
      width: calc(var(--cell) * 0.68);
      height: calc(var(--cell) * 0.68);
      opacity: 0.8;
    }

    /* The disc is what keeps the arrow legible over a bright tile as readily as over an
       empty cell, and it is the page's own ground rather than a new colour. */
    #next-move circle { fill: rgba(15, 17, 23, 0.52); }

    /* Stroked in its own fill so the arrow's corners come out as round as the tiles',
       rather than as the six points the path describes. */
    #next-move path {
      fill: #e6edf3;
      stroke: #e6edf3;
      stroke-width: 11;
      stroke-linejoin: round;
    }

    /* One arrow, turned to the move it stands for. Drawn pointing up. */
    #next-move.right svg { transform: rotate(90deg); }
    #next-move.down svg { transform: rotate(180deg); }
    #next-move.left svg { transform: rotate(-90deg); }

    /* Stats graph ----------------------------------------------------------- */

    #stats-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #stats-panel p {
      margin: 0;
      line-height: 1.35;
    }

    #chart-legend,
    #chart-readout {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: #9fb3c8;
    }

    /* Laid out rather than spaced by margins: the entries used to be run together in one
       line of text and set apart by a margin on the second swatch, which is a margin the
       swatch keeps when the line wraps -- so the entry that dropped to a second row
       started indented from the one above it. A row of rows lines them up at whatever
       width the panel is. */
    #chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 16px;
    }

    .legend-entry {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    /* The swatch is the mark it stands for, at the weight the canvas draws it: a bar for
       the bars, and a line for the line. */
    .swatch {
      width: 10px;
      border-radius: 1px;
    }

    .swatch.points { height: 2px; background: var(--series-points); }
    .swatch.undos { height: 8px; background: var(--series-undos); }

    /* Sized here and redrawn at the device's pixels by the script, which is why the
       element carries no width or height attribute: the only size that matters is the
       one CSS gives it, and the backing store is derived from that. */
    #chart {
      display: block;
      width: 100%;
      height: 132px;
      /* The board reads swipes anywhere in `main`, so pointing at a bin would otherwise
         also be a move; the swipe handler skips this popup for the same reason. */
      touch-action: none;
    }

    /* D-pad ---------------------------------------------------------------- */

    /* Two thumb clusters, not a cross: left/right sit under the left thumb and
       up/down stack under the right one, separated by a 36px channel -- 44px here,
       since the channel is on top of the 8px the buttons are spaced by. */
    #dpad {
      display: flex;
      gap: 44px;
      align-items: flex-end;
      justify-content: center;
      margin-top: 4px;
    }

    .pad-pair, .pad-stack {
      display: flex;
      gap: 8px;
    }

    .pad-stack { flex-direction: column; }

    /* The arrows are button labels drawn at the panel's text size, as imgui draws
       them; only the 74x60 hit area is oversized.

       `none` here is for the browsers that honour it, where it keeps a double tap on
       an arrow -- two ordinary moves in a row -- from being read as a zoom. WebKit
       ignores it for that, so game.js refuses the touch's default as well. */
    #dpad button {
      width: 74px;
      height: 60px;
      touch-action: none;
    }

    /* Overlay -------------------------------------------------------------- */

    #overlay {
      position: absolute;
      inset: 14px auto auto 14px;
      max-width: min(620px, calc(100% - 28px));
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      background: rgba(15, 17, 23, 0.88);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(10px);
      font-size: 13px;
      line-height: 1.4;
    }

    #overlay[hidden] { display: none; }
    #overlay strong { color: #fff; }
    #overlay small { color: #9fb3c8; }
    #overlay button { margin-top: 10px; }
  </style>
  <!-- This media query is the single source for the compact breakpoint: the script
       reads it back off the element rather than repeating the pixel count. -->
  <style id="compact-styles" media="(max-width: 700px)">
    header { padding: 8px 10px; }
    h1 { font-size: 14px; }
    #status { font-size: 11px; line-height: 1.35; }
    main { padding: 6px; }
    #panel { font-size: 13px; }
    #board-wrap { margin: 2px 0; }
    #chart { height: 108px; }
    #chart-legend, #chart-readout { font-size: 11px; }
    #overlay { inset: 8px; max-width: calc(100% - 16px); padding: 8px 10px; border-radius: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>2048 in vanilla JavaScript</h1>
    <div id="status"></div>
  </header>

  <main>
    <section id="panel">
      <!-- Where the game has got to, on two lines: what it is worth, then how far it has
           run. All four fields shared one line until a six-figure best with a replayed
           one in brackets beside it pushed the move count onto a second by itself.

           Two lines on purpose rather than one that sometimes wraps. The board is sized
           from whatever the rest of the panel leaves over, measured at startup and again
           when the play area resizes -- and a line growing a second row is neither of
           those, so the board would keep a height the panel no longer has room for. A
           line that is always two lines is measured as two.

           The move label goes last because it is the one that changes width mid-game:
           scrubbing swaps "Moves: 4" for "Move 4/12" and back on every drag, and with
           nothing to its right there is nothing for that to shove around. The clock that
           walks back through those moves stays below, with the rest of the controls. -->
      <p id="score-line">Score: 0  |  Best: 0</p>
      <p id="progress-line"><span id="play-time">Time: 0:00</span>  |  <span id="timeline-label">Moves: 0</span></p>
      <!-- The game's own controls, and after them the clock that opens the ones for
           going back through it. -->
      <div id="actions">
        <button id="new-game" type="button">New Game</button>
        <!-- The last move, taken back. Up here rather than in the popup because taking
             one move back is part of playing, while walking the history is not; what it
             does under the covers is the popup's own truncation, one state along.

             Disabled while an earlier state is on screen, so it always means the same
             thing and always costs the same: one move, the newest one. Reaching back
             further is what the popup is for, and the popup says what that costs. -->
        <button id="undo" type="button" title="Take back the last move" disabled>Undo</button>
        <button id="share" type="button">Share</button>
        <button
          id="time-travel"
          type="button"
          aria-label="Move history"
          aria-expanded="false"
          aria-controls="timeline"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 6.6 V12.4 L16.2 14.8" />
          </svg>
        </button>
        <!-- One spark line, and nothing under it. At 15px the axis was a second stroke
             carrying no information the line does not, and dropping it lets the line
             have the whole frame -- which is what makes it read as a graph beside the
             clock rather than as a scribble in the corner of one. Drawn rather than set,
             for the reason the clock is. -->
        <button
          id="graph"
          type="button"
          aria-label="Game stats"
          aria-expanded="false"
          aria-controls="stats-panel"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 17.5 L9.5 9.5 L14 13.5 L20.5 6.5" />
          </svg>
        </button>

        <!-- The slider is the whole game so far, one stop per move; the buttons beside
             it step a single move, for touch and for precision.

             Everything here starts disabled: a game with one state has nowhere to scrub
             to, and the script enables what the timeline supports as it grows. The range
             spans one move it cannot be moved along, for the reason paintTimeline gives:
             the marker belongs at the newest state from the first frame. -->
        <div id="timeline" hidden>
          <div class="step-pair">
            <button id="step-back" type="button" aria-label="Back one move" disabled>&lt;</button>
            <button id="step-forward" type="button" aria-label="Forward one move" disabled>&gt;</button>
          </div>
          <input
            id="scrubber"
            type="range"
            min="0"
            max="1"
            step="1"
            value="1"
            aria-label="Move history"
            disabled
          />
          <!-- The two ends of the same decision, and disabled in opposite conditions:
               one goes back to where the game had got to, the other makes this state
               where it has got to. Both are pointless on the newest state, which is why
               only one of them can ever be pressed. -->
          <button id="latest" type="button" disabled>Latest</button>
          <button
            id="play-from-here"
            type="button"
            title="Resume play here, discarding the moves after this one"
            disabled
          >Play from here</button>
        </div>

        <!-- The game against itself, along the moves it has taken: what it was worth,
             and what it cost to get there. One graph, two lanes -- the two series are
             measured in different units and would need two scales on one axis to share a
             lane, which is the one way of drawing this that is always misread.

             Everything in it is painted by the script; the canvas is sized in CSS and
             redrawn at the device's own pixels. -->
        <div id="stats-panel" hidden>
          <!-- Named here rather than in the drawing, so the two series are identified in
               text as well as by colour, and the swatches are where the stylesheet keeps
               the two colours the canvas reads back off them. -->
          <p id="chart-legend">
            <span class="legend-entry"><span class="swatch points"></span>Points</span>
            <span class="legend-entry"><span class="swatch undos"></span>Undos</span>
          </p>
          <canvas id="chart" role="img" aria-label="Points and undos by move"></canvas>
          <!-- The graph in words: the whole game until a bin is pointed at, then that
               bin. A canvas cannot be read by a screen reader and a hovered tooltip
               cannot be read at all, so the reading lives on a line of its own. -->
          <p id="chart-readout"></p>
        </div>
      </div>
      <!-- How to play, and where the game says its piece: a message stands in for the
           instructions while it lasts, and the instructions come back when it clears.
           Painted by the script on the first frame, so this is only what shows before
           the stylesheet's own font has loaded. -->
      <p id="help">Keyboard: arrows/WASD, swipe, [ and ] scrub, R to restart</p>

      <hr />
      <div id="board-wrap">
        <div id="board">
          <div id="grid"></div>
          <div id="tiles"></div>
          <!-- The move played from the state on screen, drawn over the board it was
               played from. Silent to a screen reader: the timeline label beside the
               score says which move that is, in words. -->
          <div id="next-move" aria-hidden="true" hidden>
            <svg viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="46" />
              <!-- Drawn inside where it lands: the stroke that rounds the corners
                   grows it back out to about here. -->
              <path d="M50 25 L72 55 H58 V74 H42 V55 H28 Z" />
            </svg>
          </div>
        </div>
      </div>
      <hr />

      <!-- The readings the board is being played under, against the board itself. The
           last line of the panel: what the game has to say is said up by the controls,
           where the instructions it replaces were being read anyway. -->
      <p id="stats">FPS: 0 | Worst: collecting | Save p50/90/99: collecting</p>

      <div id="dpad">
        <div class="pad-pair">
          <button id="left" type="button" aria-label="Left">&lt;</button>
          <button id="right" type="button" aria-label="Right">&gt;</button>
        </div>
        <div class="pad-stack">
          <button id="up" type="button" aria-label="Up">^</button>
          <button id="down" type="button" aria-label="Down">v</button>
        </div>
      </div>
    </section>

    <div id="overlay" hidden></div>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
