<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2048 with imgui-bundle + Pyodide</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e6edf3;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    }

    h1 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 650;
    }

    #status {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #9fb3c8;
      white-space: pre-wrap;
    }

    main {
      position: relative;
      min-height: 0;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: #12151f;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #overlay {
      position: absolute;
      inset: 14px auto auto 14px;
      max-width: min(620px, calc(100vw - 28px));
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      background: rgba(15, 17, 23, 0.78);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(10px);
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
    }

    #overlay strong { color: #fff; }
    #overlay small { color: #9fb3c8; }
  </style>
  <link rel="stylesheet" href="./mobile.css" media="(max-width: 700px)" />
</head>
<body>
  <header>
    <h1>2048 with imgui-bundle + Pyodide</h1>
    <div id="status">Starting…</div>
  </header>

  <main>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="overlay">
      <strong>Loading Python GUI runtime…</strong><br />
      <small>The first load downloads Pyodide and the imgui-bundle WebAssembly wheel from public CDNs/PyPI. Use arrow keys, WASD, or swipe after the game starts.</small>
    </div>
  </main>

  <script type="module">
    import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v314.0.0/full/pyodide.mjs";

    const statusEl = document.getElementById("status");
    const overlayEl = document.getElementById("overlay");
    const canvas = document.getElementById("canvas");
    const PYTHON_MODULES = ["game.py"];

    // The WebGL drawing buffer is only readable until the browser composites it, so a
    // screenshot has to be taken inside the frame that drew it. imgui-bundle drives its
    // main loop from requestAnimationFrame, so wrapping rAF here -- before Pyodide loads
    // and emscripten schedules its first frame -- gives us a hook that runs right after
    // the frame is rendered and before it is composited away.
    let pendingCapture = null;
    const originalRequestAnimationFrame = window.requestAnimationFrame.bind(window);
    window.requestAnimationFrame = (callback) => originalRequestAnimationFrame((time) => {
      callback(time);
      if (pendingCapture === null) {
        return;
      }
      const spec = pendingCapture;
      pendingCapture = null;
      shareScreenshot(spec).catch((error) => {
        if (error && error.name === "AbortError") {
          return;
        }
        console.error(error);
        log(`Share failed: ${error && error.message ? error.message : error}`);
        setTimeout(clearStatus, 4000);
      });
    });

    function log(message) {
      statusEl.hidden = false;
      statusEl.textContent = message;
      console.log(message);
    }

    function clearStatus() {
      statusEl.textContent = "";
      statusEl.hidden = true;
    }

    function resizeCanvasToDisplaySize() {
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    window.addEventListener("resize", resizeCanvasToDisplaySize);
    document.addEventListener("contextmenu", (event) => event.preventDefault());
    resizeCanvasToDisplaySize();

    window.__game2048Keys = [];
    const INPUT_THROTTLE_MS = 120;
    let lastAccepted2048InputTime = 0;
    window.__queue2048Input = (input) => {
      const now = performance.now();
      if (now - lastAccepted2048InputTime < INPUT_THROTTLE_MS) {
        return;
      }
      lastAccepted2048InputTime = now;
      window.__game2048Keys.push(input);
    };
    window.__pop2048Keys = () => {
      const keys = window.__game2048Keys.slice();
      window.__game2048Keys.length = 0;
      return JSON.stringify(keys);
    };
    window.__game2048Viewport = () => JSON.stringify({
      width: canvas.clientWidth,
      height: canvas.clientHeight,
      compact: window.matchMedia("(max-width: 700px)").matches
    });
    const bestScoreKey = "imgui-2048.bestScore";
    window.__get2048BestScore = () => {
      const value = localStorage.getItem(bestScoreKey);
      if (value === null) {
        return 0;
      }
      if (!/^\d+$/.test(value)) {
        throw new Error(`Invalid stored 2048 best score: ${value}`);
      }
      const bestScore = Number(value);
      if (!Number.isSafeInteger(bestScore)) {
        throw new Error(`Invalid stored 2048 best score: ${value}`);
      }
      return bestScore;
    };
    window.__set2048BestScore = (value) => {
      if (!Number.isSafeInteger(value) || value < 0) {
        throw new Error(`Invalid 2048 best score: ${value}`);
      }
      localStorage.setItem(bestScoreKey, String(value));
    };
    const gameStateKey = "imgui-2048.gameState.v1";
    window.__has2048GameState = () => localStorage.getItem(gameStateKey) !== null;
    window.__get2048GameState = () => {
      const value = localStorage.getItem(gameStateKey);
      if (value === null) {
        throw new Error("Missing saved 2048 game state");
      }
      return value;
    };
    window.__set2048GameState = (value) => {
      if (typeof value !== "string") {
        throw new Error("Invalid serialized 2048 game state");
      }
      localStorage.setItem(gameStateKey, value);
    };

    let playTimeSeconds = 0;
    let playTimeStartedAt = null;
    let playTimeEnabled = false;

    function settlePlayTime() {
      if (playTimeStartedAt === null) {
        return;
      }
      playTimeSeconds += (performance.now() - playTimeStartedAt) / 1000;
      playTimeStartedAt = null;
    }

    function syncPlayTime() {
      settlePlayTime();
      if (playTimeEnabled && document.visibilityState === "visible") {
        playTimeStartedAt = performance.now();
      }
    }

    document.addEventListener("visibilitychange", syncPlayTime);

    window.__set2048PlayTime = (seconds, enabled) => {
      if (!Number.isFinite(seconds) || seconds < 0) {
        throw new Error(`Invalid 2048 play time: ${seconds}`);
      }
      settlePlayTime();
      playTimeSeconds = seconds;
      playTimeEnabled = Boolean(enabled);
      syncPlayTime();
    };
    window.__start2048PlayTime = () => {
      if (!playTimeEnabled) {
        playTimeEnabled = true;
        syncPlayTime();
      }
    };
    window.__pause2048PlayTime = () => {
      settlePlayTime();
      playTimeEnabled = false;
    };
    window.__get2048PlayTime = () => {
      if (playTimeStartedAt === null) {
        return playTimeSeconds;
      }
      return playTimeSeconds + (performance.now() - playTimeStartedAt) / 1000;
    };

    const keyMap = new Map([
      ["ArrowUp", "up"], ["w", "up"], ["W", "up"],
      ["ArrowDown", "down"], ["s", "down"], ["S", "down"],
      ["ArrowLeft", "left"], ["a", "left"], ["A", "left"],
      ["ArrowRight", "right"], ["d", "right"], ["D", "right"],
      ["r", "restart"], ["R", "restart"]
    ]);

    window.addEventListener("keydown", (event) => {
      const mapped = keyMap.get(event.key);
      if (mapped) {
        event.preventDefault();
        if (event.repeat) {
          return;
        }
        window.__queue2048Input(mapped);
      }
    }, { passive: false });

    const minSwipeDistance = 36;
    let touchStart = null;

    function resetTouchStart() {
      touchStart = null;
    }

    canvas.addEventListener("touchstart", (event) => {
      if (event.touches.length !== 1) {
        resetTouchStart();
        return;
      }

      const touch = event.touches[0];
      touchStart = {
        x: touch.clientX,
        y: touch.clientY
      };
      canvas.focus();
      event.preventDefault();
    }, { passive: false });

    canvas.addEventListener("touchmove", (event) => {
      if (touchStart) {
        event.preventDefault();
      }
    }, { passive: false });

    canvas.addEventListener("touchend", (event) => {
      if (!touchStart || event.changedTouches.length === 0) {
        resetTouchStart();
        return;
      }

      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.x;
      const dy = touch.clientY - touchStart.y;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      resetTouchStart();

      if (Math.max(absX, absY) < minSwipeDistance) {
        return;
      }

      event.preventDefault();
      if (absX > absY) {
        window.__queue2048Input(dx > 0 ? "right" : "left");
      } else {
        window.__queue2048Input(dy > 0 ? "down" : "up");
      }
    }, { passive: false });

    canvas.addEventListener("touchcancel", resetTouchStart);

    const samplerCanvas = document.createElement("canvas");
    samplerCanvas.width = 1;
    samplerCanvas.height = 1;

    function samplePixel(x, y) {
      const context = samplerCanvas.getContext("2d", { willReadFrequently: true });
      context.clearRect(0, 0, 1, 1);
      context.drawImage(canvas, Math.round(x), Math.round(y), 1, 1, 0, 0, 1, 1);
      const [r, g, b] = context.getImageData(0, 0, 1, 1).data;
      return `rgb(${r}, ${g}, ${b})`;
    }

    // Python hands over the canvas rects of the pieces worth sharing -- the score line
    // and the board/message/stats block -- and they get stacked into one image so the
    // buttons and help text sitting between them are left out.
    function composeScreenshot(spec) {
      const scale = canvas.width / canvas.clientWidth;
      const pad = Math.round(12 * scale);
      const gap = Math.round(10 * scale);
      const sections = spec.sections.map((section) => ({
        x: Math.round(section.x * scale),
        y: Math.round(section.y * scale),
        width: Math.round(section.width * scale),
        height: Math.round(section.height * scale)
      }));
      if (sections.some((section) => section.width < 1 || section.height < 1)) {
        throw new Error("Screenshot region is empty");
      }

      const contentWidth = Math.max(...sections.map((section) => section.width));
      const contentHeight =
        sections.reduce((total, section) => total + section.height, 0) +
        gap * (sections.length - 1);

      const shot = document.createElement("canvas");
      shot.width = contentWidth + pad * 2;
      shot.height = contentHeight + pad * 2;
      const context = shot.getContext("2d");
      context.fillStyle = samplePixel(spec.background.x * scale, spec.background.y * scale);
      context.fillRect(0, 0, shot.width, shot.height);

      let y = pad;
      for (const section of sections) {
        context.drawImage(
          canvas,
          section.x, section.y, section.width, section.height,
          pad + (contentWidth - section.width) / 2, y, section.width, section.height
        );
        y += section.height + gap;
      }
      return shot;
    }

    async function shareScreenshot(spec) {
      const shot = composeScreenshot(spec);
      const blob = await new Promise((resolve, reject) => {
        shot.toBlob(
          (result) => (result ? resolve(result) : reject(new Error("Screenshot encoding failed"))),
          "image/png"
        );
      });
      const file = new File([blob], spec.filename, { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: spec.title, text: spec.text });
        return;
      }

      // No file sharing: desktop Chrome/Firefox never offer it, and every browser hides
      // the Web Share API on insecure origins -- which is what a phone hitting this page
      // over a LAN IP gets. Save the screenshot instead and name the reason, because
      // "insecure origin" is fixable by serving over localhost or https.
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = spec.filename;
      link.click();
      URL.revokeObjectURL(url);
      log(
        window.isSecureContext
          ? `This browser cannot share files; saved ${spec.filename}.`
          : `Sharing needs a secure origin (localhost or https); saved ${spec.filename}.`
      );
      setTimeout(clearStatus, 6000);
    }

    window.__share2048Screenshot = (payload) => {
      pendingCapture = JSON.parse(payload);
    };

    async function main() {
      try {
        log("Loading Pyodide 314.0.0…");
        const pyodide = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v314.0.0/full/"
        });

        // Route SDL/Emscripten rendering to this page's canvas before importing imgui_bundle.
        pyodide.canvas.setCanvas2D(canvas);
        pyodide._api._skip_unwind_fatal_error = true;

        log("Installing micropip…");
        await pyodide.loadPackage("micropip");

        log("Installing imgui-bundle from PyPI…");
        const micropip = pyodide.pyimport("micropip");
        await micropip.install("imgui-bundle");

        log("Loading game modules…");
        // Python sources load over HTTP rather than being inlined, so they stay
        // lintable and testable. Written into Pyodide's filesystem (its working
        // directory is on sys.path) so modules can import each other.
        for (const name of PYTHON_MODULES) {
          const response = await fetch(`./${name}`);
          if (!response.ok) {
            throw new Error(`Failed to load ${name}: ${response.status}`);
          }
          pyodide.FS.writeFile(name, await response.text());
        }

        overlayEl.style.display = "none";
        clearStatus();
        canvas.focus();
        pyodide.runPython("import game");
      } catch (error) {
        console.error(error);
        overlayEl.innerHTML = `<strong>Startup failed.</strong><br><small>${String(error).replaceAll("<", "&lt;")}</small>`;
        log(`Error: ${error && error.message ? error.message : error}`);
      }
    }

    main();
  </script>
</body>
</html>
